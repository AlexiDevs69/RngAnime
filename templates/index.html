<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e1f22" />
    <title>Rift Roll — Anime RNG</title>
    <style>
      :root {
        --bg-deep: #1e1f22;
        --bg-side: #2b2d31;
        --bg-main: #313338;
        --bg-card: #2b2d31;
        --bg-card-hover: #35373c;
        --bg-input: #1e1f22;
        --bg-pop: #111214;
        --border: #202225;
        --border-soft: #3f4147;
        --text: #f2f3f5;
        --normal: #dbdee1;
        --muted: #949ba4;
        --faint: #6d6f78;
        --brand: #5865f2;
        --brand-hover: #4752c4;
        --green: #23a55a;
        --yellow: #f0b232;
        --red: #f23f42;
        --shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
        background: var(--bg-main);
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--bg-main);
        color: var(--normal);
        font:
          15px/1.45 Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        text-rendering: optimizeLegibility;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        color: inherit;
      }
      button,
      input,
      textarea,
      select {
        outline: none;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid #8b94ff;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      img {
        display: block;
        max-width: 100%;
      }
      ::selection {
        background: rgba(88, 101, 242, 0.5);
        color: #fff;
      }
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-main);
      }
      ::-webkit-scrollbar-thumb {
        border: 3px solid var(--bg-main);
        border-radius: 8px;
        background: #191a1d;
      }
      [hidden] {
        display: none !important;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #232428;
      }
      .auth-wrap {
        width: min(920px, 100%);
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        overflow: hidden;
        border: 1px solid #17181a;
        border-radius: 12px;
        background: var(--bg-card);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }
      .auth-intro {
        min-height: 570px;
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #25272b;
        border-right: 1px solid var(--border);
      }
      .auth-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
        font-size: 18px;
        font-weight: 800;
      }
      .auth-logo,
      .brand-mark {
        display: grid;
        place-items: center;
        background: var(--brand);
        color: white;
        font-weight: 900;
      }
      .auth-logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }
      .auth-copy h1 {
        max-width: 420px;
        margin: 0 0 16px;
        color: var(--text);
        font-size: 42px;
        line-height: 1.04;
        letter-spacing: -0.04em;
      }
      .auth-copy p {
        max-width: 410px;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
      }
      .auth-note {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
      }
      .auth-note i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
      }
      .auth-panel {
        padding: 46px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .auth-panel h2 {
        margin: 0;
        color: var(--text);
        font-size: 24px;
      }
      .auth-panel > p {
        margin: 7px 0 24px;
        color: var(--muted);
      }
      .auth-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 22px;
        padding: 4px;
        background: var(--bg-input);
        border-radius: 7px;
      }
      .auth-tabs button {
        flex: 1;
        height: 36px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font-weight: 650;
        cursor: pointer;
      }
      .auth-tabs button.active {
        background: #3b3d43;
        color: var(--text);
      }
      .form-stack {
        display: grid;
        gap: 15px;
      }
      .field {
        display: grid;
        gap: 7px;
      }
      .field > span,
      .field-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .field input,
      .field textarea,
      .field select,
      .toolbar-input {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 4px;
        background: var(--bg-input);
        color: var(--text);
        padding: 10px 11px;
      }
      .field textarea {
        resize: vertical;
        min-height: 84px;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus,
      .toolbar-input:focus {
        border-color: var(--brand);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .submit-button,
      .primary,
      .roll-button {
        border: 0;
        background: var(--brand);
        color: #fff;
        font-weight: 750;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.08s;
      }
      .submit-button:hover,
      .primary:hover,
      .roll-button:hover {
        background: var(--brand-hover);
      }
      .submit-button:active,
      .primary:active,
      .roll-button:active {
        transform: translateY(1px) scale(0.985);
      }
      .submit-button {
        height: 44px;
        border-radius: 4px;
        margin-top: 4px;
      }
      .auth-error {
        min-height: 20px;
        margin: 12px 0 0;
        color: #ff8d8f;
        font-size: 13px;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        grid-template-rows: 48px minmax(0, 1fr);
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        grid-column: 1/-1;
        height: 48px;
        display: flex;
        align-items: center;
        background: var(--bg-deep);
        border-bottom: 1px solid #191a1d;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
      }
      .brand-button {
        width: 236px;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border: 0;
        border-right: 1px solid #191a1d;
        background: transparent;
        cursor: pointer;
      }
      .brand-button:hover {
        background: rgba(255, 255, 255, 0.035);
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        font-size: 14px;
      }
      .brand-button strong {
        color: var(--text);
        font-size: 14px;
      }
      .brand-button span:last-child {
        color: var(--muted);
        font-weight: 650;
      }
      .live-chip {
        min-width: 0;
        height: 32px;
        display: flex;
        align-items: center;
        gap: 7px;
        margin-left: 12px;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .live-chip:hover {
        background: rgba(255, 255, 255, 0.055);
        color: var(--normal);
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        flex: none;
      }
      .live-chip strong {
        color: var(--text);
        font-size: 12px;
      }
      .live-chip span:last-child {
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .topbar-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        padding-right: 10px;
      }
      .currency {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        color: var(--normal);
        font-size: 13px;
        font-weight: 650;
      }
      .currency i {
        color: var(--yellow);
        font-style: normal;
      }
      .profile-chip {
        height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 7px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        text-align: left;
      }
      .profile-chip:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .avatar {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        font-weight: 800;
        flex: none;
        overflow: hidden;
      }
      .profile-chip-copy {
        display: grid;
        line-height: 1.08;
      }
      .profile-chip-copy strong {
        max-width: 125px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
        font-size: 13px;
      }
      .profile-chip-copy small {
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }

      .sidebar {
        position: sticky;
        top: 48px;
        grid-column: 1;
        grid-row: 2;
        height: calc(100vh - 48px);
        display: flex;
        flex-direction: column;
        padding: 14px 8px 10px;
        overflow-y: auto;
        background: var(--bg-side);
      }
      .nav {
        display: grid;
        gap: 2px;
      }
      .nav-button {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 11px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font-weight: 600;
        cursor: pointer;
        text-align: left;
      }
      .nav-button:hover {
        background: rgba(255, 255, 255, 0.055);
        color: var(--normal);
      }
      .nav-button.active {
        background: rgba(255, 255, 255, 0.095);
        color: var(--text);
      }
      .nav-icon {
        width: 22px;
        color: inherit;
        font-size: 18px;
        text-align: center;
      }
      .nav-separator {
        height: 1px;
        margin: 12px 8px;
        background: #202225;
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 11px;
        border-top: 1px solid var(--border);
      }
      .sidebar-stat {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 6px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .sidebar-stat b {
        color: var(--normal);
      }

      .main {
        grid-column: 2;
        grid-row: 2;
        min-width: 0;
        min-height: calc(100vh - 48px);
        padding: 28px 30px 110px;
        background: var(--bg-main);
      }
      .page {
        width: min(1220px, 100%);
        margin: 0 auto;
      }
      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 22px;
      }
      .eyebrow {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .page-head h1,
      .section-head h2 {
        margin: 0;
        color: var(--text);
        letter-spacing: -0.025em;
      }
      .page-head h1 {
        font-size: 27px;
      }
      .page-head p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .page-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .primary,
      .ghost,
      .danger,
      .small-button {
        min-height: 36px;
        padding: 0 13px;
        border-radius: 4px;
        font-weight: 650;
        cursor: pointer;
      }
      .primary {
        border: 0;
        background: var(--brand);
        color: white;
      }
      .ghost,
      .small-button {
        border: 0;
        background: #3b3d43;
        color: var(--normal);
      }
      .ghost:hover,
      .small-button:hover {
        background: #45474e;
        color: var(--text);
      }
      .danger {
        border: 0;
        background: rgba(242, 63, 66, 0.13);
        color: #ff9b9d;
      }
      .danger:hover {
        background: rgba(242, 63, 66, 0.22);
      }
      .text-button {
        padding: 0;
        border: 0;
        background: none;
        color: #aeb4ff;
        cursor: pointer;
      }
      .text-button:hover {
        text-decoration: underline;
      }
      .panel {
        border: 1px solid #232428;
        border-radius: 9px;
        background: var(--bg-card);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.025);
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 13px;
      }
      .section-head h2 {
        font-size: 18px;
      }
      .section-head p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .home-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
        gap: 16px;
      }
      .hero-panel {
        min-height: 340px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        overflow: hidden;
      }
      .hero-copy {
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .hero-copy h2 {
        max-width: 520px;
        margin: 0 0 10px;
        color: var(--text);
        font-size: 31px;
        line-height: 1.08;
        letter-spacing: -0.035em;
      }
      .hero-copy p {
        max-width: 520px;
        margin: 0 0 23px;
        color: var(--muted);
        font-size: 15px;
      }
      .hero-actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .hero-art {
        position: relative;
        min-height: 300px;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #25262a;
        border-left: 1px solid var(--border);
      }
      .rift-disk {
        width: 190px;
        height: 190px;
        border: 34px solid #383b45;
        border-radius: 50%;
        box-shadow:
          inset 0 0 0 2px #1e1f22,
          0 0 0 1px #454852;
        position: relative;
      }
      .rift-disk:before {
        content: "";
        position: absolute;
        inset: 27px;
        border-radius: 50%;
        background: var(--brand);
        opacity: 0.82;
      }
      .rift-disk:after {
        content: "R";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 48px;
        font-weight: 900;
      }
      .hero-badge {
        position: absolute;
        bottom: 24px;
        left: 24px;
        right: 24px;
        padding: 11px 13px;
        border-radius: 5px;
        background: rgba(17, 18, 20, 0.87);
        color: var(--normal);
        font-size: 12px;
      }
      .hero-badge b {
        display: block;
        color: var(--text);
        font-size: 13px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .stat-card {
        min-height: 105px;
        padding: 17px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-card);
      }
      .stat-card span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .stat-card strong {
        display: block;
        margin-top: 7px;
        color: var(--text);
        font-size: 22px;
        letter-spacing: -0.03em;
      }
      .stat-card small {
        display: block;
        margin-top: 3px;
        color: var(--faint);
      }
      .wide-section {
        margin-top: 22px;
      }

      .hour-card {
        margin-top: 16px;
        padding: 18px;
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
      }
      .hour-art {
        width: 86px;
        height: 86px;
        border: 2px solid var(--rarity, #949ba4);
        border-radius: 7px;
        overflow: hidden;
        background: #202225;
      }
      .hour-copy small {
        color: var(--muted);
      }
      .hour-copy h3 {
        margin: 4px 0 3px;
        color: var(--text);
        font-size: 18px;
      }
      .hour-copy p {
        margin: 0;
        color: var(--muted);
      }
      .hour-copy b {
        color: var(--rarity, #fff);
      }
      .hour-odds {
        text-align: right;
      }
      .hour-odds strong {
        display: block;
        color: var(--text);
        font-size: 20px;
      }
      .hour-odds span {
        color: var(--muted);
        font-size: 12px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .game-card {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-top: 3px solid var(--rarity, #949ba4);
        border-radius: 7px;
        background: var(--bg-card);
        transition:
          transform 0.14s,
          background 0.14s;
      }
      .game-card:hover {
        transform: translateY(-2px);
        background: var(--bg-card-hover);
      }
      .game-card.locked .card-art {
        filter: grayscale(1);
        opacity: 0.36;
      }
      .game-card.locked .card-body {
        opacity: 0.62;
      }
      .card-art {
        position: relative;
        aspect-ratio: 4/3;
        overflow: hidden;
        background: #202225;
      }
      .card-art img {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hour-art > .card-art,
      .history-thumb > .card-art,
      .picker-thumb > .card-art,
      .slot-art > .card-art {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
      }
      .art-fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(145deg, #25272c, #1f2023);
      }
      .art-fallback:before {
        content: "";
        width: 70%;
        aspect-ratio: 1;
        border: 24px solid
          color-mix(in srgb, var(--rarity, #5865f2) 28%, transparent);
        border-radius: 50%;
        transform: rotate(-18deg);
      }
      .art-fallback b {
        position: absolute;
        color: var(--rarity, #fff);
        font-size: 42px;
        letter-spacing: -0.08em;
        opacity: 0.9;
      }
      .art-fallback small {
        position: absolute;
        bottom: 12px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      .card-badge {
        position: absolute;
        top: 9px;
        left: 9px;
        padding: 3px 6px;
        border-radius: 3px;
        background: rgba(17, 18, 20, 0.84);
        color: #fff;
        font-size: 10px;
        font-weight: 800;
      }
      .owned-badge {
        position: absolute;
        right: 9px;
        top: 9px;
        padding: 3px 7px;
        border-radius: 10px;
        background: rgba(17, 18, 20, 0.88);
        color: #fff;
        font-size: 11px;
        font-weight: 750;
      }
      .card-body {
        padding: 12px;
      }
      .rarity-row {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--rarity, #949ba4);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .rarity-row i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--rarity, #949ba4);
      }
      .rarity-row span:last-child {
        margin-left: auto;
        color: var(--muted);
        letter-spacing: 0;
        text-transform: none;
      }
      .card-body h3 {
        margin: 6px 0 2px;
        overflow: hidden;
        color: var(--text);
        font-size: 15px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .card-body p {
        height: 37px;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
      }
      .card-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .card-meta b {
        color: var(--normal);
      }

      .roll-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 310px;
        gap: 16px;
      }
      .roll-stage {
        min-height: 585px;
        display: flex;

      }
      .admin-tabs button {
        height: 36px;
        padding: 0 14px;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: var(--muted);
        font-weight: 650;
        cursor: pointer;
      }
      .admin-tabs button.active {
        background: #42444b;
        color: var(--text);
      }
      .admin-list {
        display: grid;
        gap: 7px;
      }
      .admin-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-card);
      }
      .admin-row-main {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .admin-swatch {
        width: 10px;
        height: 38px;
        border-radius: 3px;
        background: var(--swatch, #949ba4);
        flex: none;
      }
      .admin-row strong {
        display: block;
        overflow: hidden;
        color: var(--text);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .admin-row small {
        color: var(--muted);
      }
      .admin-row-actions {
        display: flex;
        gap: 6px;
      }

      .hud {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 35;
        width: 280px;
        display: grid;
        gap: 7px;
        pointer-events: none;
      }
      .hud-item {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        padding: 9px 10px;
        border: 1px solid #151618;
        border-radius: 6px;
        background: rgba(30, 31, 34, 0.96);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        pointer-events: auto;
      }
      .hud-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        background: #2b2d31;
        color: var(--accent, #fff);
        font-weight: 850;
      }
      .hud-copy {
        min-width: 0;
      }
      .hud-copy strong {
        display: block;
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .hud-copy small {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .hud-time {
        color: var(--normal);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(0, 0, 0, 0.62);
      }
      .modal {
        width: min(620px, 100%);
        max-height: min(760px, calc(100vh - 44px));
        overflow: auto;
        border: 1px solid #17181a;
        border-radius: 8px;
        background: var(--bg-side);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      }
      .modal.wide {
        width: min(820px, 100%);
      }
      .modal-head {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-side);
      }
      .modal-head h2 {
        margin: 0;
        color: var(--text);
        font-size: 19px;
      }
      .modal-head p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .close {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font-size: 22px;
        cursor: pointer;
      }
      .close:hover {
        background: #3b3d43;
        color: var(--text);
      }
      .modal-body {
        padding: 20px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .picker-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 14px;
      }
      .picker-card {
        min-width: 0;
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        padding: 7px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--rarity);
        border-radius: 5px;
        background: #25272b;
        text-align: left;
        cursor: pointer;
      }
      .picker-card:hover {
        background: #383a40;
      }
      .picker-thumb {
        width: 52px;
        height: 52px;
        position: relative;
        overflow: hidden;
        border-radius: 3px;
        background: #202225;
      }
      .picker-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .picker-copy {
        min-width: 0;
      }
      .picker-copy strong,
      .picker-copy small {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .picker-copy strong {
        color: var(--text);
        font-size: 11px;
      }
      .picker-copy small {
        color: var(--muted);
        font-size: 9px;
      }
      .player-list {
        display: grid;
        gap: 6px;
        margin-top: 14px;
      }
      .player-row {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border: 0;
        border-radius: 5px;
        background: #25272b;
        text-align: left;
        cursor: pointer;
      }
      .player-row:hover {
        background: #3a3c42;
      }
      .player-row strong {
        display: block;
        color: var(--text);
      }
      .player-row small {
        color: var(--muted);
      }
      .player-row > span:last-child {
        text-align: right;
        color: var(--muted);
        font-size: 11px;
      }
      .check-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
        margin-top: 8px;
      }
      .check-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 4px;
        background: #25272b;
        color: var(--normal);
        font-size: 12px;
      }
      .check-option input {
        accent-color: var(--brand);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        z-index: 160;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid #17181a;
        border-radius: 5px;
        background: var(--bg-pop);
        box-shadow: var(--shadow);
        color: var(--normal);
        font-size: 13px;
        animation: toast-in 0.2s ease-out;
      }
      .toast.ok:before {
        content: "✓";
        color: #6ee7a1;
        font-weight: 900;
      }
      .toast.error:before {
        content: "!";
        color: #ff8d8f;
        font-weight: 900;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translate(-50%, 8px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      .loading {
        min-height: 420px;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 10px;
        border: 3px solid #44464d;
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 1050px) {
        .card-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .home-grid {

        }

        }
        .showcase-grid {

        .brand-button {

          flex: 1;

        .brand-button span:last-child,
        .live-chip,
        .currency,

        }
        .sidebar {
          position: fixed;
          left: 0;
          right: 0;
          top: auto;
          bottom: 0;
          z-index: 80;
          width: auto;

          padding: 6px;
          background: #25262a;
          border-top: 1px solid #17181a;
          overflow-x: auto;
          overflow-y: hidden;
        }
        .nav {
          display: flex;
          min-width: max-content;
        }
        .nav-button {
          width: 72px;
          height: 52px;
          display: grid;
          place-items: center;
          gap: 0;
          padding: 2px;
          font-size: 10px;
          text-align: center;
        }
        .nav-icon {
          font-size: 18px;
        }
        .nav-separator,
        .sidebar-foot {
          display: none;
        }
        .main {
          min-height: calc(100vh - 48px);
          padding: 22px 16px 100px;
        }
        .roll-layout,
        .profile-layout {
          grid-template-columns: 1fr;
        }
        .roll-side {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .profile-card {

          width: 100%;
        }

          right: 10px;
          bottom: 74px;

        }
        .card-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .picker-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 560px) {
        .auth-shell {
          padding: 0;
        }
        .auth-wrap {
          min-height: 100vh;
          border: 0;
          border-radius: 0;
        }

        }

          flex-direction: column;

          grid-template-columns: 1fr;
        }
        .hero-art {
          display: none;
        }
        .hero-copy {
          padding: 24px;
        }
        .hero-copy h2 {
          font-size: 27px;
        }
        .card-grid {
          gap: 8px;
        }
        .card-body {
          padding: 9px;
        }
        .card-body p {
          display: none;
        }
        .card-art {
          aspect-ratio: 1;
        }
        .card-body h3 {
          font-size: 13px;
        }
        .roll-stage {
          min-height: 520px;
          padding: 18px;
        }
        .roll-stage:before {
          width: 330px;
          height: 330px;
        }
        .roll-stage:after {
          width: 220px;
          height: 220px;
        }
        .roll-side {
          grid-template-columns: 1fr;
        }
        .potion-grid,
        .event-grid {
          grid-template-columns: 1fr;

        .showcase {

        .showcase-head {

        }
        .showcase-tabs button {

        }
        .showcase-grid {
          gap: 7px;
        }
        .showcase-slot {

        }
        .hour-card {

          grid-column: 1/-1;

        .modal-backdrop {

        }
        .modal {
          max-height: 100vh;
          border-radius: 0;
        }
        .check-grid {

        }
        .admin-row {
          grid-template-columns: 1fr;
        }
        .admin-row-actions {
          justify-content: flex-end;
        }
        .dice-grid {

        }

        .upload-box {

        }
        .upload-preview {
          width: 64px;
          height: 64px;
        }
      }
    </style>
  </head>
  <body>
    <section id="auth" class="auth-shell">
      <div class="auth-wrap">
        <div class="auth-intro">
          <div class="auth-brand">
            <span class="auth-logo">R</span> RIFT ROLL
          </div>
          <div class="auth-copy">
            <h1>Колекція починається з одного ролу.</h1>
            <p>
              Збирай аніме-картки, знаходь рідкісні мутації та формуй публічну
              вітрину профілю.
            </p>
          </div>
          <div class="auth-note">
            <i></i><span>Без акаунта рол, інвентар і профілі недоступні</span>
          </div>
        </div>
        <div class="auth-panel">
          <h2 id="auth-title">З поверненням</h2>
          <p id="auth-subtitle">Увійди, щоб продовжити свою колекцію.</p>
          <div class="auth-tabs">
            <button
              id="login-tab"
              class="active"
              type="button"
              onclick="setAuthMode('login')"
            >
              Вхід
            </button>
            <button
              id="register-tab"
              type="button"
              onclick="setAuthMode('register')"
            >
              Реєстрація
            </button>
          </div>
          <form id="auth-form" class="form-stack">
            <div id="register-fields" hidden>
              <div class="form-row">
                <label class="field"
                  ><span>Ім’я</span
                  ><input
                    id="auth-name"
                    maxlength="32"
                    autocomplete="name"
                    placeholder="Alex"
                /></label>
                <label class="field"
                  ><span>Handle</span
                  ><input
                    id="auth-handle"
                    maxlength="20"
                    autocomplete="username"
                    placeholder="alex_rng"
                /></label>
              </div>
            </div>
            <label class="field"
              ><span>Email</span
              ><input
                id="auth-email"
                type="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
            /></label>
            <label class="field"
              ><span>Пароль</span
              ><input
                id="auth-password"
                type="password"
                minlength="8"
                required
                autocomplete="current-password"
                placeholder="Мінімум 8 символів"
            /></label>
            <button id="auth-submit" class="submit-button" type="submit">
              Увійти
            </button>
          </form>
          <p id="auth-error" class="auth-error"></p>
        </div>
      </div>
    </section>

    <div id="app" class="app-shell" hidden>
      <header class="topbar">
        <button class="brand-button" onclick="go('home')">
          <span class="brand-mark">R</span><strong>RIFT ROLL</strong
          ><span>Anime RNG</span>
        </button>
        <button id="top-event" class="live-chip" onclick="go('events')">
          <i class="live-dot"></i><strong>ІВЕНТ</strong
          ><span>Завантаження…</span>
        </button>
        <div class="topbar-right">
          <div class="currency"><i>◆</i><span id="top-coins">0</span></div>
          <button class="profile-chip" onclick="openOwnProfile()">
            <span id="top-avatar" class="avatar">R</span
            ><span class="profile-chip-copy"
              ><strong id="top-name">Riftwalker</strong
              ><small id="top-handle">@riftwalker</small></span
            >
          </button>
        </div>
      </header>
      <aside class="sidebar">
        <nav id="nav" class="nav"></nav>
        <div class="nav-separator"></div>
        <div class="sidebar-foot">
          <div class="sidebar-stat">
            <span>Luck</span><b id="side-luck">1.00×</b>
          </div>
          <div class="sidebar-stat">
            <span>Кубик</span><b id="side-dice">Origin</b>
          </div>
          <div class="sidebar-stat">
            <span>Дохід</span><b id="side-income">$0/s</b>
          </div>
          <div class="sidebar-stat">
            <span>Індекс</span><b id="side-index">0/0</b>
          </div>
        </div>
      </aside>
      <main id="main" class="main">
        <div class="loading">
          <div>
            <div class="spinner"></div>
            Відкриваємо рифт…
          </div>
        </div>
      </main>
    </div>
    <div id="hud" class="hud"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script>
      const state = {
        authMode: "login",
        view: "home",
        game: null,
        result: null,
        rolling: false,
        indexMutation: "base",
        search: "",
        rarity: "all",
        profile: null,
        profileTarget: null,
        profilePage: 0,
        editingShowcase: false,
        admin: null,
        adminTab: "cards",
        now: Date.now(),
      };
      const navBase = [
        ["home", "⌂", "Головна"],
        ["roll", "↻", "Крутка"],
        ["dice", "⬡", "Кубики"],
        ["index", "▤", "Індекс"],
        ["collection", "▦", "Колекція"],
        ["profile", "◎", "Профіль"],
        ["potions", "⚗", "Зілля"],
        ["events", "◷", "Івенти"],
      ];
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>'"]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[char],
        );
      const compact = (value) =>
        new Intl.NumberFormat("uk-UA", {
          notation: Number(value) >= 10000 ? "compact" : "standard",
          maximumFractionDigits: 1,
        }).format(Number(value) || 0);
      const money = (value) => "$" + compact(Math.floor(Number(value) || 0));
      const formatLuck = (value) => {
        const number = Number(value) || 0;
        return number < 1000
          ? `${number.toLocaleString("uk-UA", { maximumFractionDigits: 2 })}×`
          : `${compact(number)}×`;
      };
      const dateText = (value) => {
        const d = new Date(value);
        return Number.isNaN(d.getTime())
          ? "нещодавно"
          : new Intl.DateTimeFormat("uk-UA", {
              day: "numeric",
              month: "long",
              year: "numeric",
            }).format(d);
      };
      const initials = (value) =>
        String(value || "R")
          .split(/\s+/)
          .map((x) => x[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      const safeImage = (value) => {
        const v = String(value || "").trim();
        return /^(https?:\/\/|\/)/i.test(v) ||
          /^data:image\/(png|jpe?g|webp|gif);base64,/i.test(v)
          ? esc(v)
          : "";
      };
      const cssImage = (value) => {
        const raw = String(value || "").trim();
        if (!/^https?:\/\//i.test(raw)) return "none";
        return `url("${esc(encodeURI(raw).replace(/[()\"]/g, (char) => encodeURIComponent(char)))}")`;
      };
      const remaining = (value) => {
        if (!value) return "";
        let s = Math.max(
          0,
          Math.floor((new Date(value).getTime() - state.now) / 1000),
        );
        const h = Math.floor(s / 3600);
        s %= 3600;
        const m = Math.floor(s / 60),
          r = s % 60;
        return h
          ? `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`
          : `${m}:${String(r).padStart(2, "0")}`;
      };
      const chance = (card, cards = state.game?.cards || []) => {
        const active = cards.filter((x) => x.availableNow);
        if (!active.length || !card) return "—";
        const logLuck = Math.log(
          Math.max(1, Number(state.game?.player?.luck) || 1),
        );
        const scored = active.map((item) => ({
          id: item.id,
          log:
            Math.log(Math.max(0.000001, Number(item.baseWeight))) +
            Number(item.rarityTier) * 0.62 * logLuck,
        }));
        const peak = Math.max(...scored.map((item) => item.log));
        const weighted = scored.map((item) => ({
          ...item,
          weight: Math.exp(item.log - peak),
        }));
        const total = weighted.reduce((sum, item) => sum + item.weight, 0);
        const target = weighted.find((item) => item.id === card.id);
        if (!target || !total) return "—";
        const p = (target.weight / total) * 100;
        return p >= 0.1
          ? `${p.toFixed(p >= 10 ? 1 : 2)}%`
          : `1 / ${compact(Math.round(100 / p))}`;
      };
      function art(item, klass = "") {
        const src = safeImage(item.imageUrl);
        return `<div class="${klass} card-art" style="--rarity:${esc(item.rarityColor || "#949ba4")}">${src ? `<img src="${src}" alt="${esc(item.name)}" onerror="this.hidden=true">` : ""}<div class="art-fallback"><b>${esc(initials(item.name))}</b><small>RIFT ROLL</small></div></div>`;
      }
      function avatarMarkup(url, name) {
        const src = safeImage(url);
        return src
          ? `<img src="${src}" alt="${esc(name)}" onerror="this.replaceWith(document.createTextNode('${esc(initials(name))}'))">`
          : esc(initials(name));
      }

        body.append("purpose", purpose);
        body.append("file", file);
        if (status) status.textContent = "Завантажуємо й конвертуємо…";
        try {
          const data = await api("/api/admin/upload", { method: "POST", body });
          $(inputId).value = data.url;
          previewAdminMedia(data.url, previewId);
          if (status)
            status.textContent = "Готово. URL буде збережено разом із записом.";
          toast("Зображення завантажено.");
        } catch (e) {
          if (status) status.textContent = e.message;
          toast(e.message, "error");
        }
      }
      function mutationForm(x = {}) {
        return `<div class="form-stack"><div class="form-row"><label class="field"><span>Назва</span><input name="name" value="${esc(x.name || "")}" required></label><label class="field"><span>Колір</span><input name="color" type="color" value="${esc(x.color || "#ffffff")}"></label></div><div class="form-row"><label class="field"><span>Шанс (0.08 = 8%)</span><input name="chance" type="number" step="0.000001" min="0.000001" max="100" value="${x.chance ?? 0.01}" required></label><label class="field"><span>Множник доходу</span><input name="income_multiplier" type="number" step="0.01" min="1" value="${x.incomeMultiplier ?? 1}" required></label></div><label class="field"><span>Івент</span><select name="event_id">${eventOptions(x.eventId)}</select></label><label class="check-option"><input name="event_only" type="checkbox" ${checked(x.eventOnly)}> Тільки під час івенту</label><label class="check-option"><input name="is_active" type="checkbox" ${checked(x.isActive ?? true)}> Мутація активна</label></div>`;
      }
      function localDate(value) {
        if (!value) return "";
        const d = new Date(value);
        return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
          .toISOString()
          .slice(0, 16);
      }
      function eventForm(x = {}) {
        return `<div class="form-stack"><label class="field"><span>Назва</span><input name="name" value="${esc(x.name || "")}" required></label><label class="field"><span>Опис</span><textarea name="description">${esc(x.description || "")}</textarea></label><div class="form-row"><label class="field"><span>Колір</span><input name="accent" type="color" value="${esc(x.accent || "#f0b232")}"></label><label class="field"><span>Статус</span><select name="status">${["scheduled", "active", "paused"].map((v) => `<option ${x.status === v ? "selected" : ""}>${v}</option>`).join("")}</select></label></div><div class="form-row"><label class="field"><span>Початок</span><input name="start_at" type="datetime-local" value="${localDate(x.startAt)}"></label><label class="field"><span>Кінець</span><input name="end_at" type="datetime-local" value="${localDate(x.endAt)}"></label></div></div>`;
      }
      function potionForm(x = {}) {
        return `<div class="form-stack"><label class="field"><span>Назва</span><input name="name" value="${esc(x.name || "")}" required></label><label class="field"><span>Опис</span><textarea name="description">${esc(x.description || "")}</textarea></label><div class="form-row"><label class="field"><span>Тип ефекту</span><select name="effect_type"><option value="luck" ${x.effectType === "luck" ? "selected" : ""}>luck</option><option value="speed" ${x.effectType === "speed" ? "selected" : ""}>speed</option></select></label><label class="field"><span>Множник</span><input name="multiplier" type="number" step="0.01" min="1.01" value="${x.multiplier ?? 1.5}" required></label></div><div class="form-row"><label class="field"><span>Тривалість, секунд</span><input name="duration_seconds" type="number" min="5" value="${x.durationSeconds ?? 600}" required></label><label class="field"><span>Стартова кількість</span><input name="starter_quantity" type="number" min="0" value="${x.starterQuantity ?? 0}" required></label></div><label class="field"><span>Колір</span><input name="color" type="color" value="${esc(x.color || "#5865f2")}"></label><label class="check-option"><input name="is_active" type="checkbox" ${checked(x.isActive ?? true)}> Зілля активне</label></div>`;
      }
      async function saveAdmin(event, kind, id) {
        event.preventDefault();
        const form = new FormData(event.target),
          data = Object.fromEntries(form);
        if (kind === "cards") {
          data.rarity_tier = Number(data.rarity_tier);
          data.base_weight = Number(data.base_weight);
          data.income_per_second = Number(data.income_per_second);
          data.event_id = data.event_id ? Number(data.event_id) : null;
          data.event_only = form.has("event_only");
          data.is_active = form.has("is_active");
          data.mutation_ids = form.getAll("mutation_ids").map(Number);
        }
        if (kind === "dice") {
          data.base_luck = Number(data.base_luck);
          data.unlock_cost = Number(data.unlock_cost);
          data.upgrade_base_cost = Number(data.upgrade_base_cost);
          data.luck_growth = Number(data.luck_growth);
          data.max_level = Number(data.max_level);
          data.required_level = Number(data.required_level);
          data.sort_order = Number(data.sort_order);
          data.is_starter = form.has("is_starter");
          data.is_active = form.has("is_active");
        }
        if (kind === "mutations") {
          data.chance = Number(data.chance);
          data.income_multiplier = Number(data.income_multiplier);
          data.event_id = data.event_id ? Number(data.event_id) : null;
          data.event_only = form.has("event_only");
          data.is_active = form.has("is_active");
        }
        if (kind === "events") {
          data.start_at = data.start_at
            ? new Date(data.start_at).toISOString()
            : null;
          data.end_at = data.end_at
            ? new Date(data.end_at).toISOString()
            : null;
        }
        if (kind === "potions") {
          data.multiplier = Number(data.multiplier);
          data.duration_seconds = Number(data.duration_seconds);
          data.starter_quantity = Number(data.starter_quantity);
          data.is_active = form.has("is_active");
        }
        try {
          state.admin = await api(`/api/admin/${kind}${id ? "/" + id : ""}`, {
            method: id ? "PUT" : "POST",
            body: JSON.stringify(data),
          });
          closeModal();
          await loadGame();
          render();
          toast("Зміни збережено.");
        } catch (e) {
          toast(e.message, "error");
        }
      }
      async function deleteAdmin(kind, id) {
        const item = state.admin[kind].find((x) => x.id === id),
          name = item?.name || "цей запис";
        if (!confirm(`Видалити «${name}»?`)) return;
        try {
          state.admin = await api(`/api/admin/${kind}/${id}`, {
            method: "DELETE",
          });
          await loadGame();
          render();
          toast("Видалено.");
        } catch (e) {
          toast(e.message, "error");
        }
      }
      async function toggleAdminEvent(id) {
        try {
          state.admin = await api(`/api/admin/events/${id}/toggle`, {
            method: "POST",
          });
          await loadGame();
          render();
          toast("Статус івенту змінено.");
        } catch (e) {
          toast(e.message, "error");
        }
      }
      function renderHud() {
        if (!state.game || $("app").hidden) {
          $("hud").innerHTML = "";
          return;
        }
        const live = state.game.events.find((x) => x.isLive),
          active = state.game.potions.filter(
            (x) =>
              x.activeUntil && new Date(x.activeUntil).getTime() > state.now,
          );
        $("hud").innerHTML = [
          live
            ? `<div class="hud-item"><span class="hud-icon" style="--accent:${esc(live.accent)}">◷</span><span class="hud-copy"><strong>${esc(live.name)}</strong><small>Активний івент</small></span><span class="hud-time">${live.endAt ? remaining(live.endAt) : "LIVE"}</span></div>`
            : "",
          ...active.map(
            (p) =>
              `<div class="hud-item"><span class="hud-icon" style="--accent:${esc(p.color)}">⚗</span><span class="hud-copy"><strong>${esc(p.name)}</strong><small>${p.effectType} ${p.multiplier}×</small></span><span class="hud-time">${remaining(p.activeUntil)}</span></div>`,
          ),
        ].join("");
      }
      function openModal(content, wide = "") {
        $("modal-root").innerHTML =
          `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal ${wide}">${content}</section></div>`;
      }
      function closeModal() {
        $("modal-root").innerHTML = "";
      }
      setInterval(() => {
        state.now = Date.now();
        renderHud();
        if (state.view === "potions" || state.view === "events") render();
      }, 1000);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeModal();
      });
      boot();
    </script>
  </body>
</html>
